apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: proxy-gateway

namespace: fiap

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - xray-daemon.yaml

commonLabels:
  project: fiap
  service: proxy

images:
  - name: fiap/proxy-gateway
    newTag: latest
