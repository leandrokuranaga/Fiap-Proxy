apiVersion: v1
kind: Secret
metadata:
  name: proxy-secrets
  labels:
    app: proxy-gateway
type: Opaque
stringData:
  # JWT Settings
  JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
  # AWS Credentials (usado pelo SDK AWS automaticamente)
  AWS_ACCESS_KEY_ID: "${AWS_SQS_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SQS_SECRET_KEY}"
  AWS_DEFAULT_REGION: "${AWS_REGION}"
  # AWS Credentials para CloudWatch (usado pelo código)
  AWS_SQS_ACCESS_KEY: "${AWS_SQS_ACCESS_KEY}"
  AWS_SQS_SECRET_KEY: "${AWS_SQS_SECRET_KEY}"
