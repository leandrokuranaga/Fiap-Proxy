apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-gateway
  labels:
    app: proxy-gateway
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy-gateway
  template:
    metadata:
      labels:
        app: proxy-gateway
        tier: frontend
    spec:
      containers:
        - name: proxy-gateway
          image: kuranaga/fiap-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: proxy-config
            - secretRef:
                name: proxy-secrets
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
